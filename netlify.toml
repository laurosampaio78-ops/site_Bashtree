# Configuração do Netlify (site estático, sem etapa de build)
[build]
  publish = "."

# Os arquivos de conteúdo mudam pelo painel: sempre buscar a versão mais nova
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Anotações internas do projeto não ficam públicas
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
